# Declares the packages so `python -m falconvar.…` works from any directory.
# Not a distribution: no wheel, no console_scripts -- `python -m` is the
# documented interface, and a second spelling would be a second thing to keep
# correct.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falconvar"
version = "3.0.0"
description = "Video and audio in, searchable moments out."
requires-python = ">=3.12"
# Pins live in requirements.txt, which is what is actually installed. Repeating
# them here would create two lists that drift; this file declares the packages,
# not the environment.
dependencies = []

[tool.setuptools.package-data]
# The built-in prompts are data inside the package, not a resource beside it:
# `python -m falconvar.workflow` from any directory has to find them, and an
# editable install that resolves them by `__file__` would stop working the day
# it becomes a real one.
"falconvar.describe" = ["prompts.json"]

[tool.setuptools]
# Explicit rather than discovered: `docs`, `db` and `data` are not Python, and
# auto-discovery would either pick them up or refuse to guess.
packages = [
    "api",
    "falconvar",
    "falconvar.aggregate",
    "falconvar.aggregate.llm",
    "falconvar.aggregate.model",
    "falconvar.aggregate.statistics",
    "falconvar.audio",
    "falconvar.audio.backends",
    "falconvar.boundaries",
    "falconvar.cut",
    "falconvar.describe",
    "falconvar.describe.backends",
    "falconvar.media",
    "falconvar.rag",
    "falconvar.rag.embed",
    "falconvar.rag.embed.indexes",
    "falconvar.rag.retrieve",
    "falconvar.shared",
    "falconvar.video",
    "falconvar.video.samplers",
    "falconvar.video.samplers.perception",
]
# `recovery/` is deliberately absent, and has no `__init__.py`. It is the
# standalone kit -- hand someone those files, a manifest and the video and they
# rebuild the store with only `av`, `opencv-python` and `numpy`. Installing it
# beside the pipeline is the first step towards it importing from one.
